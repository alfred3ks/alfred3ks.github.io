<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Open graph -->
  <meta property="og:title" content="Alfredo Sánchez - Desarrollador Web." />
  <meta property="og:description"
    content="En este portfolio encontraras información sobre mi, mís habilidades y los trabajos que he realizado." />
  <meta property="og:image"
    content="https://github.com/alfred3ks/alfred3ks.github.io/blob/main/public/assets/img/img-open-graph.png?raw=true" />
  <!-- Open graph de twitter -->
  <meta property="twitter:card" content="summary" />
  <!-- Favicon -->
  <link rel="shortcut icon" href="./public/assets/img/favicon.svg" type="image/x-icon" />
  <!-- Estilos propios -->
  <link rel="stylesheet" href="./public/css/reset.css" />
  <link rel="stylesheet" href="./public/css/common.css" />
  <link rel="stylesheet" href="./public/css/header.css" />
  <link rel="stylesheet" href="./public/css/about.css" />
  <link rel="stylesheet" href="./public/css/skills.css" />
  <link rel="stylesheet" href="./public/css/projects.css" />
  <link rel="stylesheet" href="./public/css/footer.css" />
  <!-- Fontawesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
    integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous" />
  <script src="https://kit.fontawesome.com/0d46cb983a.js" crossorigin="anonymous"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;900&display=swap" rel="stylesheet" />
  <title>Alfredo Sánchez - Desarrollador Web.</title>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__brand">
      <h1 class="header__name">
        <a href="alfred3ks.github.io">Alfredo <span class="header__name-highlight">Sánchez</span></a>
      </h1>
    </div>

    <!-- Navbar -->
    <nav class="header__nav" id="list">
      <ul class="header__list" id="list__hide">
        <li class="header__item"><a href="#about__me">Sobre mi</a></li>
        <li class="header__item"><a href="#skills__menu">Skills</a></li>
        <li class="header__item"><a href="#projects">Proyectos</a></li>
        <li class="header__item header__item--cta">
          <a href="mailto:alfred3ks@protonmail.com">Contacto</a>
        </li>
      </ul>
    </nav>

    <!-- Menu hamburguesa -->
    <button type="button" class="header__toggle" id="toggle">
      <div class="header__toggle-1"></div>
      <div class="header__toggle-2"></div>
    </button>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- About -->
    <section class="about" id="about__me"></section>

    <!-- Skills -->
    <section class="skills">
      <h2 class="skills__title" id="skills__menu">Skills</h2>
      <div class="skills__container" id="skills__container"></div>
    </section>

    <!-- Projects -->
    <section class="projects" id="projects">
      <h2 class="card__title">Proyectos</h2>
      <div class="projects__container" id="projects__container"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer__container-title">
      Copyright ©<span id="year">2019</span> - Alfredo Sánchez
    </p>
    <div class="footer__container-contact">
      <a href="mailto:alfred3ks@protonmail.com"><i class="fa-solid fa-envelope"></i></a>
      <a href="https://github.com/alfred3ks" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/alfredo-sanchez75" target="_blank"><i class="fab fa-linkedin"></i></a>
    </div>
  </footer>

  <script src="./public/bundle.js" type="module"></script>
</body>
</html>
